
name: GDScript Formatting

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.gd'
      - '.github/workflows/gdscript-format.yml'

  push:
    branches:
      - main
    paths:
      - '**.gd'

permissions:
  contents: read
  pull-requests: write

jobs:
  formatting:
    name: Check GDScript formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install gdtoolkit
        run: pip install gdtoolkit

      - name: Check formatting
        id: format
        run: |
          set +e
          gdformat --check . > format-check.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat format-check.txt
          exit 0

      - name: Generate formatting diff
        run: |
          gdformat --diff . > format-diff.txt 2>&1 || true

      - name: Run GDScript linter
        id: lint
        run: |
          set +e
          gdlint . > lint-report.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat lint-report.txt
          exit 0

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          FORMAT_STATUS: ${{ steps.format.outputs.exit_code }}
          LINT_STATUS: ${{ steps.lint.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');

            const marker = '<!-- gdscript-style-check -->';

            const formatStatus = process.env.FORMAT_STATUS;
            const lintStatus = process.env.LINT_STATUS;

            const readReport = (file) => {
              try {
                return fs.readFileSync(file, 'utf8').trim();
              } catch {
                return 'Report unavailable.';
              }
            };

            const formatDiff = readReport('format-diff.txt');
            const lintReport = readReport('lint-report.txt');

            const formatFailed = formatStatus !== '0';
            const lintFailed = lintStatus !== '0';
            const failed = formatFailed || lintFailed;

            let body = `${marker}
            ## 🤖 GDScript Style Check

            ${failed
              ? '❌ **Style violations found.** Please fix the issues before merging.'
              : '✅ **All GDScript style checks passed!**'}

            | Check | Result |
            |---|---|
            | Formatting (gdformat) | ${formatFailed ? '❌ Failed' : '✅ Passed'} |
            | Linting (gdlint) | ${lintFailed ? '❌ Failed' : '✅ Passed'} |

            `;

            if (formatFailed) {
              body += `
            ### 🎨 Formatting differences

            Run \`gdformat .\` locally to apply these changes.

            <details open>
            <summary>View formatting diff</summary>

            \`\`\`diff
            ${formatDiff.slice(0, 12000)}
            \`\`\`

            </details>

            `;
            }

            if (lintFailed) {
              body += `
            ### 🔍 Linter violations

            <details open>
            <summary>View lint report</summary>

            \`\`\`text
            ${lintReport.slice(0, 12000)}
            \`\`\`

            </details>

            `;
            }

            body += `
            ---
            <sub>Automatically generated by GDScript Formatting GitHub Action.</sub>
            `;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number }
            );

            const existingComment = comments.find(
              comment => comment.body?.includes(marker)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

      - name: Fail if checks failed
        if: always()
        run: |
          if [[ "${{ steps.format.outputs.exit_code }}" != "0" ]] || \
             [[ "${{ steps.lint.outputs.exit_code }}" != "0" ]]; then
            echo "::error::GDScript style checks failed."
            exit 1
          fi
