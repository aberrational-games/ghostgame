name: GDScript Formatting

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.gd'
      - '.github/workflows/gdscript-format.yml'

  push:
    branches:
      - main
    paths:
      - '**.gd'

permissions:
  contents: read
  pull-requests: write

jobs:
  formatting:
    name: Check GDScript formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GDQuest GDScript Formatter
        run: |
          wget https://github.com/GDQuest/GDScript-formatter/releases/download/0.27.0/gdscript-formatter-0.27.0-linux-x86_64.zip
          unzip gdscript-formatter-0.27.0-linux-x86_64.zip
          chmod +x gdscript-formatter
          sudo mv gdscript-formatter /usr/local/bin/gdscript-formatter

      - name: Check formatting
        id: format
        shell: bash
        run: |
          mapfile -t files < <(find . -type f -name '*.gd' -not -path './addons/*')

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No GDScript files to check."
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
