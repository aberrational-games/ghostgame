name: GDScript Formatting

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.gd'
      - '.github/workflows/gdscript-format.yml'

  push:
    branches:
      - main
    paths:
      - '**.gd'

permissions:
  contents: read
  pull-requests: write

jobs:
  formatting:
    name: Check GDScript formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GDQuest GDScript Formatter
        run: |
          wget https://github.com/GDQuest/GDScript-formatter/releases/download/0.27.0/gdscript-formatter-0.27.0-linux-x86_64.zip
          unzip gdscript-formatter-0.27.0-linux-x86_64.zip
          chmod +x gdscript-formatter-0.27.0-linux-x86_64
          sudo mv gdscript-formatter-0.27.0-linux-x86_64 /usr/local/bin/gdscript-formatter

      - name: Check formatting
        id: format
        shell: bash
        run: |
          mapfile -t files < <(find . -type f -name '*.gd' -not -path './addons/*')

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No GDScript files to check."
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gdscript-formatter --check "${files[@]}" > format-check.txt 2>&1; then
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          else
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          fi

          cat format-check.txt

      - name: Generate formatting diff
        if: always()
        shell: bash
        run: |
          mapfile -t files < <(find . -type f -name '*.gd' -not -path './addons/*')

          if [[ ${#files[@]} -gt 0 ]]; then
            gdscript-formatter "${files[@]}" > /dev/null 2>&1 || true
            git diff > format-diff.txt
            git checkout .
          else
            echo "No GDScript files to check." > format-diff.txt
          fi

      - name: Run GDScript linter
        id: lint
        shell: bash
        run: |
          mapfile -t files < <(find . -type f -name '*.gd' -not -path './addons/*')

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No GDScript files to lint."
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gdscript-formatter lint "${files[@]}" > lint-report.txt 2>&1; then
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          else
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          fi

          cat lint-report.txt

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          FORMAT_STATUS: ${{ steps.format.outputs.exit_code }}
          LINT_STATUS: ${{ steps.lint.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');

            const marker = '<!-- gdscript-style-check -->';

            const formatStatus = process.env.FORMAT_STATUS;
            const lintStatus = process.env.LINT_STATUS;

            const readReport = (file) => {
              try {
                return fs.readFileSync(file, 'utf8').trim() || 'No details available.';
              } catch {
                return 'Report unavailable.';
              }
            };

            const formatDiff = readReport('format-diff.txt');
            const lintReport = readReport('lint-report.txt');

            const formatFailed = formatStatus !== '0';
            const lintFailed = lintStatus !== '0';
            const failed = formatFailed || lintFailed;

            const lines = [
              marker,
              '## GDScript Style Check',
              '',
              failed
                ? '❌ **Style violations found.** Please fix the issues before merging.'
                : '✅ **All GDScript style checks passed!**',
              '',
              '| Check | Result |',
              '|---|---|',
              `| Formatting (gdscript-formatter) | ${formatFailed ? '❌ Failed' : '✅ Passed'} |`,
              `| Linting (gdscript-formatter lint) | ${lintFailed ? '❌ Failed' : '✅ Passed'} |`,
              ''
            ];

            if (formatFailed) {
              lines.push(
                '### Formatting violations',
                '',
                'Run the formatter locally to apply the suggested formatting.',
                '',
                '<details open>',
                '<summary>View formatting diff</summary>',
                '',
                '````diff',
                formatDiff.slice(0, 10000),
                '````',
                '',
                '</details>',
                ''
              );
            }

            if (lintFailed) {
              lines.push(
                '### Linter violations',
                '',
                'Review the reported file names and line numbers.',
                '',
                '<details open>',
                '<summary>View lint report</summary>',
                '',
                '````text',
                lintReport.slice(0, 10000),
                '````',
                '',
                '</details>',
                ''
              );
            }

            lines.push(
              '---',
              '<sub>Automatically generated by GDScript Formatting GitHub Action.</sub>'
            );

            const body = lines.join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number }
            );

            const existingComment = comments.find(
              comment => comment.body?.includes(marker)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body
              });

              core.info('Updated existing GDScript style comment.');
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });

              core.info('Created GDScript style comment.');
            }

      - name: Fail if checks failed
        if: always()
        shell: bash
        env:
          FORMAT_STATUS: ${{ steps.format.outputs.exit_code }}
          LINT_STATUS: ${{ steps.lint.outputs.exit_code }}
        run: |
          failed=0

          if [[ "$FORMAT_STATUS" != "0" ]]; then
            echo "::error::GDScript formatting check failed."
            failed=1
          fi

          if [[ "$LINT_STATUS" != "0" ]]; then
            echo "::error::GDScript lint check failed."
            failed=1
          fi

          if [[ "$failed" == "0" ]]; then
            echo "All GDScript style checks passed!"
          fi

          exit "$failed"
